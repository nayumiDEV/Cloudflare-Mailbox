<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OTP Inbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%234285F4' d='M4 12v24c0 2.2 1.8 4 4 4h4V20L4 12z'/%3E%3Cpath fill='%2334A853' d='M36 40h4c2.2 0 4-1.8 4-4V12l-8 8v20z'/%3E%3Cpath fill='%23EA4335' d='M4 12l20 15 20-15-4-3-16 12L8 9 4 12z'/%3E%3Cpath fill='%23FBBC05' d='M12 20v20h24V20L24 29 12 20z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
// Apply the stored theme before first paint so there is no light flash.
(function(){try{var t=localStorage.getItem('otp-theme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.classList.toggle('dark',t==='dark');}catch(e){}})();
</script>
<link rel="stylesheet" href="/static/app.css?v=__ASSET_VERSION__">
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<button id="theme-toggle" class="theme-toggle" type="button" onclick="toggleTheme()" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">☾</button>
<script src="/static/app.js?v=__ASSET_VERSION__"></script>
<datalist id="user-list"></datalist>
</body>
</html>
