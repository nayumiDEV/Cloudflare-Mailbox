# Koyeb Deployment Configuration
# Documentation: https://www.koyeb.com/docs/reference/koyeb-yaml
name: otp-inbox-app
services:
  - name: otp-inbox
    type: web
    builder: nixpacks
    instance_type: nano
    scaling:
      min: 1
      max: 1
    ports:
      - port: 8000
        path: /
    routes:
      - path: /
        port: 8000
    health_checks:
      - http:
          port: 8000
          path: /health
    env:
      - key: STORE_RAW_MIME
        value: "0"
      - key: STORE_ATTACHMENTS
        value: "1"
      - key: AUTO_DELETE_ENABLED
        value: "1"
      - key: AUTO_DELETE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "1"
      - key: SQLITE_CACHE_SIZE_KB
        value: "2000"
      - key: MAX_EMAIL_BYTES
        value: "3145728"
      - key: MAX_ATTACHMENT_BYTES
        value: "1048576"
      - key: MAX_ATTACHMENTS_TOTAL
        value: "2097152"
